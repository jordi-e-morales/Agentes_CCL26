# Control de RED (Cilium): quien puede hablar con quien, y para pedir que.
#
# LO QUE ESTAS POLITICAS DEMUESTRAN, Y LO QUE NO
# ----------------------------------------------
# Demuestran dos cosas distintas, y la segunda es la incomoda:
#
#   1. Cilium SI distingue metodo y ruta. Un agente puede hacer POST /mcp y
#      nada mas: cualquier otra ruta se corta con 403. Eso es capa 7 de verdad.
#
#   2. Cilium NO puede ver QUE HERRAMIENTA se llamo. Las seis viven detras de
#      la misma ruta, porque MCP multiplexa sobre JSON-RPC. consulta_historial
#      y dispone_caso son, para la red, la misma peticion.
#
# El insight #3 del CLAUDE.md dice que la politica tiene que ser sobre la
# intencion del mensaje y no sobre el par origen-destino. Esto lo extiende:
# incluso la capa 7 se queda corta si el protocolo multiplexa.
#
# CILIUM NO INSPECCIONA PROMPTS. Hace politica L7 sobre metodo y ruta. La
# deteccion de inyeccion es analisis de contenido y es otra capa. Nunca
# mezclarlas (CLAUDE.md §6, regla de honestidad).
#
# ALCANCE: en Cilium, un pod seleccionado por alguna politica pasa a denegar por
# omision en esa direccion. Los que no se seleccionan siguen abiertos. Por eso
# aqui se nombran solo tres grupos, y el Collector se queda sin restringir.
#
# Aplicar / quitar:
#   kubectl apply  -f seguridad/cilium-l7.yaml
#   kubectl delete -f seguridad/cilium-l7.yaml
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentes-salida
  namespace: agentes
spec:
  endpointSelector:
    matchLabels:
      rol: agente
  egress:
    # DNS PRIMERO. Con denegacion por omision, sin esta regla no se resuelve
    # ningun nombre y todo lo demas falla con errores que no apuntan a la
    # politica. Es el error clasico al escribir la primera CiliumNetworkPolicy.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
          rules:
            dns:
              - matchPattern: "*"

    # LA ARISTA AUTORIZADA. Solo /mcp, solo hacia el servidor de herramientas.
    # Cualquier otra ruta se corta con 403.
    #
    # Y aqui esta el limite que el segmento 6 tiene que enseñar: las SEIS
    # herramientas viajan por esta misma regla. La red no puede distinguir una
    # consulta de una disposicion.
    #
    # POR QUE TRES METODOS Y NO SOLO POST
    # -----------------------------------
    # Costo un 500 averiguarlo, el 2026-09-23. Streamable HTTP, el transporte de
    # MCP, usa los tres para cosas distintas:
    #
    #   POST    las peticiones JSON-RPC. AQUI viajan las llamadas a herramientas.
    #   GET     abre el canal SSE por el que el servidor manda sus mensajes.
    #   DELETE  cierra la sesion al terminar.
    #
    # Con solo POST permitido, el cliente no puede abrir el canal y la sesion
    # MCP no se establece. El sintoma fue un 500 en el agente y en Hubble una
    # linea `http-request DROPPED (GET /mcp)`. La politica le corto el transporte
    # a su propio equipo — el mismo error que cometio la lista blanca de Tetragon
    # matando nuestro `cat`.
    #
    # Y OJO CON LA LECTURA FACIL: esto no debilita el argumento, lo refuerza.
    # Sigue siendo una sola ruta para las seis herramientas. Ahora ademas se ve
    # que la red no distingue ni siquiera entre "abrir un canal" y "disponer de
    # un caso": lo primero es un GET y lo segundo un POST, pero los dos son
    # /mcp, y que uno sea peligroso no se deduce del metodo.
    - toEndpoints:
        - matchLabels:
            app: servidor-mcp
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
          rules:
            http:
              - method: "POST"
                path: "/mcp"
              - method: "GET"
                path: "/mcp"
              - method: "DELETE"
                path: "/mcp"

    # EL SALTO LATERAL, Y LA MEJOR LAMINA DE LA SESION.
    #
    # Un agente le habla a otro con POST /a2a. Comparalo con la regla de arriba:
    #
    #   A2A: Cilium ve la arista Y la ruta.   /a2a es /a2a.
    #   MCP: Cilium ve la arista y nada mas.  /mcp son las SEIS herramientas.
    #
    # Los dos protocolos son JSON-RPC sobre HTTP. La diferencia es que A2A usa
    # una ruta por proposito y MCP multiplexa todo sobre una. Por eso el §6 dice
    # que incluso la capa 7 se queda corta si el protocolo multiplexa: aqui
    # estan las dos reglas, una al lado de la otra, para demostrarlo.
    #
    # Sin esta regla el salto lateral se corta: al seleccionar a los agentes,
    # esta politica los pone en denegacion por omision para toda su salida. Es
    # el motivo por el que mover los agentes a pods OBLIGA a escribirla.
    - toEndpoints:
        - matchLabels:
            rol: agente
      toPorts:
        - ports:
            - {port: "7010", protocol: TCP}
          rules:
            http:
              - method: "POST"
                path: "/a2a"

    # Las trazas al Collector. Sin esta regla los spans se pierden en silencio:
    # el exportador OTLP no se queja de forma visible, asi que el sintoma seria
    # una cascada incompleta sin ningun error que lo explique.
    - toEndpoints:
        - matchLabels:
            app: otel-collector
      toPorts:
        - ports:
            - {port: "4318", protocol: TCP}

    # EL MOTOR DE INFERENCIA NO ESTA AQUI, Y SU REGLA TAMPOCO.
    #
    # vLLM corre fuera del cluster, en el host, y la regla que lo permite la
    # escribe lab/publica-vllm.sh — no este archivo. El motivo es que necesita
    # una IP que se calcula:
    #
    #   `toEntities: [host]` NO FUNCIONA en kind. Medido en la v1 y vuelto a
    #   ver el 2026-09-23: Cilium no clasifica la puerta de enlace de la red
    #   Docker (172.18.0.1) como la entidad `host` — esa entidad es el NODO
    #   (172.18.0.2), que es otra cosa. La regla no matchea y el egress al
    #   modelo se queda en timeout, sin nada en el log que lo explique.
    #
    #   Lo que si funciona es un toCIDRSet /32 con la IP de esa puerta. Y esa
    #   IP cambia en cada reconstruccion del lab, asi que no se puede teclear
    #   aqui: se calcula donde ya se calcula todo lo demas del host.
    #
    # Aplicar esta politica SIN correr publica-vllm.sh deja a los agentes sin
    # modelo, porque seleccionarlos aqui los pone en denegacion por omision.
    # agentes-up.sh corre las dos cosas en orden, y por eso es el camino bueno.

  # NO hay regla hacia postgres. Esa omision es deliberada y es el demo: el
  # agente NO puede ir directo a la base. Tiene que pasar por la herramienta.
  #
  # Y NO se restringe la ENTRADA a los agentes, tambien a proposito. En cuanto
  # una politica los seleccionara para ingress, quedarian en denegacion por
  # omision en esa direccion y el `kubectl port-forward` con el que la interfaz
  # del host los alcanza dejaria de funcionar — con un fallo que parece de la
  # interfaz y no de la red. Lo que el segmento 6 necesita cortar esta en la
  # salida, que es donde el agente comprometido actua.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: servidor-mcp-aristas
  namespace: agentes
spec:
  endpointSelector:
    matchLabels:
      app: servidor-mcp
  ingress:
    # Solo los agentes le hablan, y solo por /mcp. Los tres metodos son los del
    # transporte Streamable HTTP; ver la nota en agentes-salida.
    - fromEndpoints:
        - matchLabels:
            rol: agente
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
          rules:
            http:
              - method: "POST"
                path: "/mcp"
              - method: "GET"
                path: "/mcp"
              - method: "DELETE"
                path: "/mcp"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
          rules:
            dns:
              - matchPattern: "*"
    # ESTE si puede hablar con la base. Es el unico.
    - toEndpoints:
        - matchLabels:
            app: postgres
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-solo-herramientas
  namespace: agentes
spec:
  endpointSelector:
    matchLabels:
      app: postgres
  ingress:
    # La regla que hace visible el intento del agente comprometido: si alguien
    # que no sea el servidor de herramientas toca el 5432, no pasa, y Hubble lo
    # registra aunque nadie emita una traza confesandolo.
    - fromEndpoints:
        - matchLabels:
            app: servidor-mcp
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
